<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEKA TEKI | MARLITHPROJECT</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    background:#000;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

/* serpihan putih */
body::before{
    content:"";
    position:fixed;
    inset:-100%;
    background-image:
        radial-gradient(circle,rgba(255,255,255,.35) 1px,transparent 2px),
        radial-gradient(circle,rgba(255,255,255,.18) 1px,transparent 2px);
    background-size:70px 70px,120px 120px;
    animation:debu 25s linear infinite;
    pointer-events:none;
}

@keyframes debu{
    from{transform:translate(0,0)}
    to{transform:translate(120px,180px)}
}

.website{
    width:92%;
    max-width:520px;
    min-height:680px;
    background:rgba(10,10,10,.95);
    border:1px solid #333;
    border-radius:25px;
    box-shadow:0 0 50px rgba(255,255,255,.08);
    overflow:hidden;
    position:relative;
    z-index:2;
}

.header{
    padding:25px;
    text-align:center;
    border-bottom:1px solid #292929;
}

.header h1{
    margin:0;
    font-size:30px;
    letter-spacing:6px;
}

.header p{
    margin:8px 0 0;
    color:#777;
    font-size:12px;
    letter-spacing:4px;
}

.welcome{
    text-align:center;
    padding:75px 25px;
}

.welcome h2{
    font-size:32px;
    margin-bottom:15px;
}

.welcome p{
    color:#888;
    line-height:1.6;
}

button{
    border:none;
    background:#fff;
    color:#000;
    padding:13px 30px;
    border-radius:10px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    transform:scale(1.04);
    background:#ddd;
}

button:active{
    transform:scale(.96);
}

.game{
    display:none;
    padding:32px 25px 80px;
    text-align:center;
}

.nomor{
    display:inline-block;
    padding:7px 15px;
    border:1px solid #444;
    border-radius:20px;
    color:#888;
    font-size:12px;
    margin-bottom:18px;
}

.soal{
    background:#151515;
    border:1px solid #292929;
    padding:28px 18px;
    border-radius:16px;
    margin-bottom:20px;
    font-size:19px;
    line-height:1.5;
    box-shadow:inset 0 0 30px rgba(255,255,255,.02);
}

input{
    width:100%;
    padding:14px;
    background:#050505;
    color:#fff;
    border:1px solid #333;
    border-radius:10px;
    outline:none;
    font-size:16px;
    text-align:center;
    margin-bottom:12px;
}

input:focus{
    border-color:#aaa;
}

#hasil{
    min-height:25px;
    margin-top:15px;
    font-weight:bold;
}

.skor{
    margin-top:18px;
    color:#888;
}

.hintArea{
    margin-top:15px;
}

.hintButton{
    background:#151515;
    color:#fff;
    border:1px solid #444;
    padding:9px 20px;
    font-size:13px;
}

.hintButton:disabled{
    opacity:.35;
    cursor:not-allowed;
    transform:none;
}

#hintText{
    color:#aaa;
    font-size:14px;
    margin-top:10px;
    min-height:20px;
}

#timerHint{
    color:#555;
    font-size:11px;
    margin-top:7px;
}

.menyerah{
    margin-top:12px;
    background:#111;
    color:#777;
    border:1px solid #333;
    font-size:12px;
    padding:9px 18px;
}

#tai{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    font-size:140px;
    z-index:999;
    display:none;
    animation:muncul .4s ease;
}

@keyframes muncul{
    0%{
        transform:translate(-50%,-50%) scale(0);
    }
    100%{
        transform:translate(-50%,-50%) scale(1);
    }
}

.footer{
    position:absolute;
    bottom:0;
    width:100%;
    text-align:center;
    padding:18px;
    border-top:1px solid #292929;
    color:#555;
    font-size:11px;
    letter-spacing:4px;
}
</style>
</head>

<body>

<div class="website">

<div class="header">
    <h1>TEKA TEKI</h1>
    <p>MARLITHPROJECT</p>
</div>

<div class="welcome" id="welcome">
    <h2>Selamat Datang</h2>

    <p>
        Uji logika, akal, dan kemampuan
        berpikirmu dengan berbagai teka-teki.
    </p>

    <button onclick="mulaiGame()">MULAI</button>
</div>

<div class="game" id="game">

    <div class="nomor" id="nomorSoal">

    </div>

    <div class="soal" id="soal"></div>

    <input
        type="text"
        id="jawaban"
        placeholder="Tulis jawabanmu..."
        onkeydown="if(event.key==='Enter') cekJawaban()"
    >

    <button onclick="cekJawaban()">JAWAB</button>

    <div id="hasil"></div>

    <div class="skor">
        Skor: <span id="skor">0</span>
    </div>

    <div class="hintArea">

        <button
            class="hintButton"
            id="hintButton"
            onclick="gunakanHint()"
            disabled
        >
            💡 HINT
        </button>

        <div id="hintText"></div>

        <div id="timerHint">
            Hint tersedia dalam 10:00
        </div>

    </div>

    <button class="menyerah" onclick="menyerah()">
        Menyerah kah?
    </button>

</div>

<div class="footer">
    MARLITHPROJECT
</div>

</div>

<div id="tai">💩</div>

let nomor=0;
let skor=0;
let hintTersedia=false;
let waktuHint=600;

function mulaiGame(){

    document.getElementById("welcome").style.display="none";
    document.getElementById("game").style.display="block";

    tampilkanSoal();
    mulaiTimer();
}

function tampilkanSoal(){

    document.getElementById("nomorSoal").innerText=
        "SOAL "+(nomor+1);

    document.getElementById("soal").innerText=
        soal[nomor].pertanyaan;

    document.getElementById("jawaban").value="";

    document.getElementById("hasil").innerText="";

    document.getElementById("hintText").innerText="";
}

function cekJawaban(){

    let jawaban=document
        .getElementById("jawaban")
        .value
        .toLowerCase()
        .trim();

    let hasil=document.getElementById("hasil");

    if(jawaban===""){
        hasil.innerText="⚠️ Tulis jawaban dulu.";
        return;
    }

    let benar=soal[nomor].jawaban.some(
        x=>jawaban===x
    );

    if(benar){

        skor+=10;

        document.getElementById("skor").innerText=skor;

        hasil.innerText="✅ BENAR!";

        nomor++;

        if(nomor<soal.length){

            setTimeout(tampilkanSoal,700);

        }else{

            document.getElementById("soal").innerText=
                "🎉 SEMUA SOAL SELESAI!";

            document.getElementById("nomorSoal").innerText=
                "SELESAI";

            document.getElementById("jawaban").style.display="none";

            hasil.innerText=
                "Skor akhir: "+skor;

        }

    }else{

        hasil.innerText="❌ SALAH! Coba lagi.";
    }
}

function mulaiTimer(){

    setInterval(()=>{

        if(hintTersedia)return;

        waktuHint--;

        let menit=Math.floor(waktuHint/60);

        let detik=waktuHint%60;

        if(detik<10)detik="0"+detik;

        document.getElementById("timerHint").innerText=
            "Hint tersedia dalam "+menit+":"+detik;

        if(waktuHint<=0){

            hintTersedia=true;

            document.getElementById("hintButton").disabled=false;

            document.getElementById("timerHint").innerText=
                "💡 HINT TERSEDIA!";

        }

    },1000);
}

function gunakanHint(){

    if(!hintTersedia)return;

    document.getElementById("hintText").innerText=
        "💡 Hint: "+soal[nomor].hint;

    hintTersedia=false;

    waktuHint=600;

    document.getElementById("hintButton").disabled=true;
}

function menyerah(){

    let tai=document.getElementById("tai");

    tai.style.display="block";

    setTimeout(()=>{
        tai.style.display="none";
    },2500);
}
